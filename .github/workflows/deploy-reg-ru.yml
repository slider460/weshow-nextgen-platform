name: Deploy to Reg.ru

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-reg-ru
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build (index + .htaccess + route dirs)
        run: |
          ls -la dist/
          test -f dist/index.html && echo "index.html OK"
          test -f dist/.htaccess && echo ".htaccess OK" || echo "WARNING: .htaccess missing"
          test -f dist/portfolio/index.html && echo "portfolio/index.html OK"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: dist/
          server-dir: /weshow/
          exclude: |
            **/mail/config.php
          state-name: .ftp-deploy-sync-state.json
          log-level: verbose
