name: 🚀 Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: # Для ручного запуска

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: 📚 Install dependencies
        run: npm ci --ignore-scripts || npm install --legacy-peer-deps --ignore-scripts
        
      - name: 🔨 Build project
        run: npm run build
        
      - name: 📦 Install Vercel CLI
        run: npm install -g vercel@latest
        
      - name: 🔗 Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "🔗 Привязываем проект к Vercel..."
          mkdir -p .vercel
          echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\",\"projectName\":\"weshow-nextgen-platform\"}" > .vercel/project.json
          
      - name: 🚀 Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "🚀 Деплоим на Vercel Production..."
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
          
      - name: ✅ Deployment success
        if: success()
        run: |
          echo "🎉 Сайт успешно развернут на https://www.weshow.su"
          echo "📝 Проверьте деплой в Vercel Dashboard"
          
      - name: ❌ Deployment failed
        if: failure()
        run: |
          echo "❌ Ошибка при деплое!"
          echo "🔍 Проверьте логи выше для деталей"
          echo "💡 Убедитесь, что все секреты настроены правильно"
