name: 🚀 Deploy to Vercel

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Только ручной запуск при необходимости

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: 📚 Install dependencies
        run: npm ci
        
      - name: 🔨 Build project
        run: npm run build
        
      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
          
      - name: 📧 Send notification
        if: success()
        run: |
          echo "✅ Сайт успешно развернут на Vercel!"
          echo "🌐 Домен: www.weshow.su"
          echo "📅 Время: $(date)"
          echo "🔗 URL: https://www.weshow.su"
          
      - name: 📧 Send failure notification
        if: failure()
        run: |
          echo "❌ Ошибка при развертывании!"
          echo "📅 Время: $(date)"
          echo "🔍 Проверьте логи выше для деталей"
